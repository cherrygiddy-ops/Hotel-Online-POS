name: Deploy POS Frontend

on:
  push:
    branches: [ "main" ]   # adjust if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

      - name: Build Frontend Docker image
        run: docker build -t ghcr.io/cherrygiddy-ops/hotelpos_frontend:latest .

      - name: Push Frontend Docker image
        run: docker push ghcr.io/cherrygiddy-ops/hotelpos_frontend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u cherrygiddy-ops --password-stdin

            # Ensure deployment repo exists
            if [ ! -d "/app/hotelpos-deployment" ]; then
              git clone https://github.com/cherrygiddy-ops/Hotel-POS-Deployment.git /app/hotelpos-deployment
            fi

            cd /app/hotelpos-deployment
            git pull origin main

            # Pull and redeploy only the frontend container
            docker compose pull frontend
            docker compose up -d frontend

            # Show container status
            docker compose ps
